[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storm-animation"
version = "0.2.0"
description = "An interactive STORM microscopy lab and scientific presentation deck."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
lab = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1"]
slides = ["manim>=0.18.0", "manim-slides>=5.0.0"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27,<1",
    "ruff>=0.11",
]

[project.scripts]
storm-lab = "storm_slides.lab:main"

[tool.setuptools.packages.find]
include = ["storm_slides*"]

[tool.setuptools.package-data]
storm_slides = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
