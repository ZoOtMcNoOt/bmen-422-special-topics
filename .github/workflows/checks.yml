name: Simulator checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scientific-and-app-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[lab,dev]"
      - run: python -m pytest
      - run: python -m ruff check storm_slides/lab.py storm_slides/specimens.py storm_slides/models.py storm_slides/simulator.py storm_slides/utils_plot.py tests
      - run: npm test
      - run: npm run check
