name: Simulator checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: simulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scientific-and-app-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install -e ".[lab,dev]"
      - run: python -m pytest
      - run: python -m ruff check storm_slides/lab.py storm_slides/specimens.py storm_slides/models.py storm_slides/simulator.py storm_slides/utils_plot.py tests
      - run: npm test
      - run: npm run check
